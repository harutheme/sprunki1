<!DOCTYPE html>
<html>
<head>
<script>
if (window.top !== window.self) {
    var isAllowed = false;
    var allowedDomains = ["miniwebgames.com","miniwebgames.local","localhost","harutheme.github.io"];
    if (window.location.ancestorOrigins && window.location.ancestorOrigins.length > 0) {
        for (var i = 0; i < window.location.ancestorOrigins.length; i++) {
            for (var j = 0; j < allowedDomains.length; j++) {
                if (window.location.ancestorOrigins[i].indexOf(allowedDomains[j]) !== -1) {
                    isAllowed = true;
                    break;
                }
            }
            if (isAllowed) break;
        }
    } else if (document.referrer) {
        for (var k = 0; k < allowedDomains.length; k++) {
            if (document.referrer.indexOf(allowedDomains[k]) !== -1) {
                isAllowed = true;
                break;
            }
        }
    } else {
        isAllowed = true;
    }
    if (!isAllowed) {
        document.documentElement.innerHTML = '<div style="color:white;background:black;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;"><h1>Hotlinking is disabled.</h1></div>';
        throw new Error('Hotlinking disabled.');
    }
}
</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
  <title>Sprunki Un Anti Shifted Phase 5</title>
  <style>
    body {
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #000000;
    }
    :root, body.is-fullscreen {
      background-color: #000000;
    }
    [hidden] {
      display: none !important;
    }
    h1 {
      font-weight: normal;
    }
    a {
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
    }
    #app, #loading, #error, #launch {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      background-color: #000000;
    }
    #launch {
      background-color: rgba(0, 0, 0, 0.7);
      cursor: pointer;
    }
    .green-flag {
      width: 80px;
      height: 80px;
      padding: 16px;
      border-radius: 100%;
      background: rgba(255, 255, 255, 0.75);
      border: 3px solid hsla(0, 100%, 100%, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    .progress-bar-outer {
      border: 1px solid currentColor;
      height: 10px;
      width: 200px;
      max-width: 200px;
    }
    .progress-bar-inner {
      height: 100%;
      width: 0;
      background-color: currentColor;
    }
    .loading-text, noscript {
      font-weight: normal;
      font-size: 36px;
      margin: 0 0 16px;
    }
    #error-message, #error-stack {
      font-family: monospace;
      max-width: 600px;
      white-space: pre-wrap;
      user-select: text;
      -webkit-user-select: text;
    }
    #error-stack {
      text-align: left;
      max-height: 200px;
      overflow: auto;
    }
    .sc-canvas {
      cursor: auto;
    }
  </style>
  <meta name="theme-color" content="#000000">
</head>
<body>
  <div id="app"></div>

  <div id="launch" class="screen" hidden title="Click to start">
    <div class="green-flag">
      <svg viewBox="0 0 16.63 17.5" width="42" height="44">
        <defs><style>.cls-1,.cls-2{fill:#4cbf56;stroke:#45993d;stroke-linecap:round;stroke-linejoin:round;}.cls-2{stroke-width:1.5px;}</style></defs>
        <path class="cls-1" d="M.75,2A6.44,6.44,0,0,1,8.44,2h0a6.44,6.44,0,0,0,7.69,0V12.4a6.44,6.44,0,0,1-7.69,0h0a6.44,6.44,0,0,0-7.69,0"/>
        <line class="cls-2" x1="0.75" y1="16.75" x2="0.75" y2="0.75"/>
      </svg>
    </div>
  </div>

  <div id="loading" class="screen">
    <noscript>Enable JavaScript</noscript>
    <h1 class="loading-text">miniwebgames.com</h1>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="loading-inner"></div></div>
  </div>

  <div id="error" class="screen" hidden>
    <h1>Error</h1>
    <details>
      <summary id="error-message"></summary>
      <p id="error-stack"></p>
    </details>
  </div>

  <script src="scaffolding-min.js"></script>
  <script>
    const appElement = document.getElementById("app");
    const launchScreen = document.getElementById("launch");
    const loadingScreen = document.getElementById("loading");
    const loadingInner = document.getElementById("loading-inner");
    const errorScreen = document.getElementById("error");
    const errorScreenMessage = document.getElementById("error-message");
    const errorScreenStack = document.getElementById("error-stack");

    const handleError = (error) => {
      console.error(error);
      if (!errorScreen.hidden) return;
      errorScreen.hidden = false;
      errorScreenMessage.textContent = "" + error;
      let debug = (error && error.stack) || "no stack";
      debug += "\nUser agent: " + navigator.userAgent;
      errorScreenStack.textContent = debug;
    };

    const setProgress = (progress) => {
      if (loadingInner) loadingInner.style.width = (progress * 100) + "%";
    };
    const interpolate = (a, b, t) => a + t * (b - a);

    let scaffolding;
    let vm;

    try {
      setProgress(0.1);

      scaffolding = new Scaffolding.Scaffolding();
      scaffolding.width = 640;
      scaffolding.height = 360;
      scaffolding.resizeMode = "preserve-ratio";
      scaffolding.editableLists = false;
      scaffolding.usePackagedRuntime = true;
      scaffolding.setup();
      scaffolding.appendTo(appElement);

      vm = scaffolding.vm;
      window.scaffolding = scaffolding;
      window.vm = scaffolding.vm;
      window.Scratch = {
        vm,
        renderer: vm.renderer,
        audioEngine: vm.runtime.audioEngine,
        bitmapAdapter: vm.runtime.v2BitmapAdapter,
        videoProvider: vm.runtime.ioDevices.video.provider
      };

      scaffolding.setUsername("player####".replace(/#/g, () => Math.floor(Math.random() * 10)));
      scaffolding.setAccentColor("#ff4c4c");

      vm.setTurboMode(false);
      if (vm.setInterpolation) vm.setInterpolation(false);
      if (vm.setFramerate) vm.setFramerate(30);
      if (vm.renderer.setUseHighQualityRender) vm.renderer.setUseHighQualityRender(false);
      if (vm.setRuntimeOptions) vm.setRuntimeOptions({
        fencing: true,
        miscLimits: true,
        maxClones: 300
      });
      if (vm.setCompilerOptions) vm.setCompilerOptions({
        enabled: true,
        warpTimer: false
      });
      if (vm.renderer.setMaxTextureDimension) vm.renderer.setMaxTextureDimension(2048);
      if (vm.runtime.setEnforcePrivacy) vm.runtime.setEnforcePrivacy(false);

      if (typeof ScaffoldingAddons !== "undefined") {
        ScaffoldingAddons.run(scaffolding, {
          gamepad: false,
          pointerlock: false,
          specialCloudBehaviors: false,
          unsafeCloudBehaviors: false,
          pause: false
        });
      }

      scaffolding.setExtensionSecurityManager({
        getSandboxMode: () => "unsandboxed",
        canLoadExtensionFromProject: () => true
      });

      // Gracefully skip non-critical or Gandi-proprietary extensions so the game still boots
      if (typeof vm._loadExtensions === "function") {
        const origLoadExtensions = vm._loadExtensions.bind(vm);
        vm._loadExtensions = async function(extensionIDs, extensionURLs) {
          const urls = extensionURLs || new Map();
          for (const id of extensionIDs) {
            try {
              await origLoadExtensions(new Set([id]), urls);
            } catch (extErr) {
              console.warn("Skipping unsupported extension:", id, extErr);
            }
          }
        };
      }
    } catch (e) {
      handleError(e);
    }

    const getProjectData = (function() {
      const storage = scaffolding.storage;
      storage.onprogress = (total, loaded) => {
        if (total > 0) {
          setProgress(interpolate(0.2, 0.98, loaded / total));
        }
      };

      storage.addHelper({
        load: (assetType, assetId, dataFormat) => {
          const path = "assets/" + (assetId + "." + dataFormat).toLowerCase();
          return fetch(path)
            .then((res) => {
              if (!res.ok) {
                console.warn("Missing asset: " + path);
                return null;
              }
              return res.arrayBuffer();
            })
            .then((buf) => {
              if (!buf) return null;
              return storage.createAsset(assetType, dataFormat, new Uint8Array(buf), assetId);
            });
        }
      });

      return () => fetch("assets/project.json")
        .then((res) => {
          if (!res.ok) {
            throw new Error("Failed to load assets/project.json (HTTP " + res.status + ")");
          }
          setProgress(0.2);
          return res.arrayBuffer();
        });
    })();

    const run = async () => {
      const projectData = await getProjectData();
      await scaffolding.loadProject(projectData);
      setProgress(1);
      loadingScreen.hidden = true;
      launchScreen.hidden = false;
      launchScreen.addEventListener("click", () => {
        launchScreen.hidden = true;
        scaffolding.start();
      });
      launchScreen.focus();
    };
    run().catch(handleError);
  </script>
</body>
</html>
